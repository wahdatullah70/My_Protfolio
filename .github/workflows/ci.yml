name: Portfolio CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python utilities
        run: python -m compileall showcase
      - name: Run Slurm Ops Automation tests
        run: python -m unittest discover -s showcase/slurm-ops-automation/tests -v
      - name: Generate fixture-backed Slurm demo report
        shell: bash
        run: |
          set +e
          python showcase/slurm-ops-automation/slurm_ops.py \
            --fixture-dir showcase/slurm-ops-automation/fixtures \
            --json-out /tmp/slurm-report.json \
            --markdown-out /tmp/slurm-report.md
          rc=$?
          set -e
          test "$rc" -eq 1
          python - <<'PY'
          import json
          report = json.load(open('/tmp/slurm-report.json'))
          assert report['status'] == 'warning'
          assert report['summary']['nodes_total'] == 3
          assert report['summary']['jobs_total'] == 3
          print(report['summary'])
          PY
      - name: Run Kubernetes Platform Auditor tests
        run: python -m unittest discover -s showcase/kubernetes-platform-auditor/tests -v
      - name: Generate fixture-backed Kubernetes audit
        shell: bash
        run: |
          set +e
          python showcase/kubernetes-platform-auditor/platform_auditor.py \
            --fixture-dir showcase/kubernetes-platform-auditor/fixtures \
            --output /tmp/k8s-audit.json --pretty
          rc=$?
          set -e
          test "$rc" -eq 1
          python - <<'PY'
          import json
          report = json.load(open('/tmp/k8s-audit.json'))
          assert report['status'] == 'warning'
          assert report['summary']['nodes_with_pressure'] == 1
          assert report['summary']['crashloop_pods'] == 1
          assert report['summary']['pods_with_unready_containers'] == 2
          print(report['summary'])
          PY
      - name: Validate operations shell scripts
        shell: bash
        run: |
          find ops-toolkit -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f"
          done
      - name: Validate Slurm batch script syntax as Bash
        run: bash -n ops-toolkit/slurm-job-template.sbatch
      - name: Install Infra Health API dependencies
        run: pip install -r showcase/infra-health-api/requirements.txt
      - name: Run Infra Health API tests
        run: python -m unittest discover -s showcase/infra-health-api/tests -v
      - name: Import Infra Health API
        run: |
          cd showcase/infra-health-api
          python -c "import app; print(app.app.title, app.app.version)"
      - name: Install HPC Platform Control Plane dependencies
        run: pip install -r showcase/hpc-platform-control-plane/requirements.txt
      - name: Run HPC Platform Control Plane tests
        run: python -m unittest discover -s showcase/hpc-platform-control-plane/tests -v
      - name: Generate HPC Platform Control Plane demo report
        shell: bash
        run: |
          set +e
          python showcase/hpc-platform-control-plane/cli.py \
            --json-out /tmp/hpc-control-plane.json \
            --markdown-out /tmp/hpc-control-plane.md \
            --metrics-out /tmp/hpc-control-plane.metrics
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          report = json.load(open('/tmp/hpc-control-plane.json'))
          assert report['status'] == 'critical'
          assert report['summary']['nodes_total'] == 4
          assert report['summary']['jobs_pending'] == 1
          assert report['summary']['incidents_total'] >= 7
          print(report['summary'])
          PY
