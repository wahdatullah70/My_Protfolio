apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infra-health-api
  template:
    metadata:
      labels:
        app: infra-health-api
    spec:
      containers:
        - name: api
          image: infra-health-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
